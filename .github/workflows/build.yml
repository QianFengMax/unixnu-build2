name: build sheng iPadOS 27 (verified path, images to Release)

# 复刻 s1eke/UniXNU-sheng 的 package.yml——该配置在 2026-11-19 08:25 实测成功产出 images-27。
# 与上游 macos.yml 的关键区别：走 scripts/package.sh（unixnu release），一次跑完全流程，
# 避免分步调用时 bootstrap pass 的链接失败；core 固定在已验证的 563595ab。

on:
  workflow_dispatch:
    inputs:
      device_ref:
        description: UniXNU-sheng ref (branch/tag/sha)
        type: string
        default: main
      core_ref:
        description: UniXNU core ref (563595ab is the verified pin)
        type: string
        default: 563595abedfdfa413ad583b66b6176d82007e633
      os:
        description: OS profile
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: Create a NEW installation seed if no saved seed exists (iPadOS 27)
        type: boolean
        default: true
      publish_release:
        description: Publish a Release with the images
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Check out device sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: ${{ inputs.device_ref }}
          path: device
          submodules: recursive
          token: ${{ github.token }}

      - name: Check out core sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.core_ref }}
          path: UniXNU
          submodules: recursive
          token: ${{ github.token }}

      - name: Check out firmware sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: main
          path: uefi-sheng
          submodules: recursive
          token: ${{ github.token }}

      - name: Patch UniXNU metal bridge for ios27
        run: |
          set -e
          P="$GITHUB_WORKSPACE/device/.github/patches/0065-ios-read-pages-and-mapped-writable.patch"
          if [ -f "$P" ]; then
            cp "$P" "$GITHUB_WORKSPACE/UniXNU/drivers/AdrenoMetal/bridge/patches/"
            python3 "$GITHUB_WORKSPACE/tools-patch-bridge.py"
          else
            echo "no 0065 patch in the device tree; skipping"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify inputs
        run: |
          set -e
          echo "device: $(git -C device   rev-parse HEAD)  $(git -C device   log -1 --format=%s)"
          echo "core:   $(git -C UniXNU   rev-parse HEAD)  $(git -C UniXNU   log -1 --format=%s)"
          echo "uefi:   $(git -C uefi-sheng rev-parse HEAD)"
          test -f device/board.toml || { echo "::error::missing board.toml"; exit 1; }
          ls device/configs/
          df -h "$GITHUB_WORKSPACE"
          xcodebuild -version

      - name: Install host tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools \
                       bison pkgconf rustup blacktop/tap/ipsw
          command -v unifdef || brew install unifdef
          {
            echo "$HOME/.cargo/bin"
            echo "$(brew --prefix llvm)/bin"
            echo "$(brew --prefix bison)/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src || true

      - name: Report the toolchain
        run: |
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea \
                   compression_tool mtools mcopy ipsw rustc cargo; do
            printf '%-20s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          xcrun --sdk iphoneos --show-sdk-version

      - name: platform seed
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          test -n "$UNIXNU_UNIQUE_CHIP_ID" || { echo "::error::set the UNIXNU_UNIQUE_CHIP_ID secret"; exit 1; }
          echo "seed is set (${#UNIXNU_UNIQUE_CHIP_ID} chars)"

      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          set -e
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          echo "running: scripts/package.sh ${args[*]}"
          scripts/package.sh "${args[@]}"

      - name: inventory outputs
        if: always()
        run: |
          echo "=== outputs ==="
          find UniXNU/out -maxdepth 6 -type f \
            \( -name 'boot.img' -o -name 'payload.img' -o -name 'kernel.macho' \
               -o -name 'package.manifest.json' -o -name 'userdata-root.img' \
               -o -name 'userdata-root.json' -o -name 'data.dbr' \) \
            -exec ls -lh {} \; || true

      - name: collect
        if: always()
        run: |
          mkdir -p out-artifacts
          for n in boot.img payload.img kernel.macho package.manifest.json userdata-root.img userdata-root.json data.dbr; do
            find UniXNU/out -maxdepth 6 -type f -name "$n" -exec cp -v {} out-artifacts/ \; || true
          done
          ls -lh out-artifacts/ || true
          cd out-artifacts && shasum -a 256 * > SHA256SUMS.txt 2>/dev/null && cat SHA256SUMS.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-ipados${{ inputs.os }}-images
          path: out-artifacts/
          compression-level: 0
          retention-days: 5

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            UniXNU/out/sheng/*/*/logs/*.log
          retention-days: 5

      - name: Publish Release
        if: inputs.publish_release && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd out-artifacts
          ls -1
          TAG="sheng-ipados${{ inputs.os }}-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" * \
            --repo "${{ github.repository }}" \
            --title "sheng iPadOS ${{ inputs.os }} images ($TAG)" \
            --notes "device UniXNU-sheng@$(git -C ../device rev-parse --short HEAD), core UniXNU@$(git -C ../UniXNU rev-parse --short HEAD). Built on $(date -u)."
          echo "released $TAG"

      - name: Remove proprietary inputs
        if: always()
        run: |
          rm -rf UniXNU/out/ipsw UniXNU/out/feeds device/.cache/firmware 2>/dev/null || true