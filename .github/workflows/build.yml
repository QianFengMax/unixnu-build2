name: build sheng iPadOS 27 (persistent boot, latest fixes)

# 目标：产出可【刷入 boot 分区、脱离电脑启动】的 UniXNU 镜像，并包含最新修复。
#
# 依据官方文档（unixnu.com）：
#   - Building: scripts/package.sh 是官方打包入口（unixnu release：deps/preflight/patches/build/pack/verify）
#   - guide/userdata: 首次安装用 --init-data 生成 Data seed
#   - reference/cli: --kernel-arg 可覆盖板级启动参数
#
# 非临时启动的必要条件（本 workflow 逐条落实并校验）：
#   1. boot.img 必须 ≤ boot_b 分区 192 MiB（201326592 B），payload size_mib=176
#   2. 命令行不得含 autoreset=（否则会定时重启回 fastboot）
#   3. 必须含 uefi-watchdog=1 —— 固件 SHENG_BOOT_GUARD 会 arm 30000 ms Gunyah 看门狗，
#      DXE 在 ExitBootServices 交出后若内核不接管，30 秒即硬件复位（详见 porting.toml）
#
# 最新修复：
#   - device 用 PR #138 的 head commit be604455：
#       它是 main(c8f92b20, 11-18) 的超集（compare API：main 相对它 0 提交 0 文件差异），
#       额外 10 个提交 14 个文件，含 issue #138 的 sheng-startup-failure-log.patch 修复
#       （该 PR 至今未合入 main，若用 main 会在 bsd/kern/kern_exec.c:10118 处 patch does not apply）、
#       CONFIG_XNU_OPTIMIZE_FOR_SIZE、QcomGeniSpi、build-ath12k-wifi.py 等。
#   - core 固定 563595ab：其后的 8542980d/519d8024 仅改 devices.toml 与 docs/，无代码差异
#   - 应用 0065-ios-read-pages-and-mapped-writable.patch：
#     metal2vulkan 的 read_pages/mapped_writable 只声明在 target_os="macos"，
#     ios27 上编译报 E0425，必须把 cfg 扩到 ios（否则 GPU bridge 构建失败）
#
# 平台种子：secrets.UNIXNU_UNIQUE_CHIP_ID（8 位 hex，请自行保管，不要入库）

on:
  workflow_dispatch:
    inputs:
      device_ref:
        description: UniXNU-sheng ref
        type: string
        default: be604455450eb70d5fcbf98e7406f7205593a524
      core_ref:
        description: UniXNU core ref (563595ab = verified; later commits are docs-only)
        type: string
        default: 563595abedfdfa413ad583b66b6176d82007e633
      os:
        description: OS profile
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: Create a NEW Data seed (first installation)
        type: boolean
        default: true
      watchdog:
        description: Add uefi-watchdog=1 (REQUIRED for persistent boot off the PC)
        type: boolean
        default: true
      publish_release:
        description: Publish a Release with the images
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-persistent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 350
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Check out this workflow repository
        uses: actions/checkout@v4
        with:
          path: build

      - name: Check out device sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: ${{ inputs.device_ref }}
          path: device
          submodules: recursive
          token: ${{ github.token }}

      - name: Check out core sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.core_ref }}
          path: UniXNU
          submodules: recursive
          token: ${{ github.token }}

      - name: Check out firmware sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: main
          path: uefi-sheng
          submodules: recursive
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install host tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools \
                       bison pkgconf rustup blacktop/tap/ipsw
          command -v unifdef >/dev/null || brew install unifdef
          {
            echo "$HOME/.cargo/bin"
            echo "$(brew --prefix llvm)/bin"
            echo "$(brew --prefix bison)/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          rustup default 1.98.0

      - name: Report the toolchain
        run: |
          set -e
          echo "device: $(git -C device    rev-parse HEAD)  $(git -C device    log -1 --format=%s)"
          echo "core:   $(git -C UniXNU    rev-parse HEAD)  $(git -C UniXNU    log -1 --format=%s)"
          echo "uefi:   $(git -C uefi-sheng rev-parse HEAD)"
          test -f device/board.toml || { echo "::error::missing board.toml"; exit 1; }
          ls device/configs/
          for t in clang xcodebuild make ninja cmake dtc fdtget fdtput mtools mcopy \
                   ipsw rustc cargo compression_tool aea; do
            printf '%-20s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          xcodebuild -version
          df -h "$GITHUB_WORKSPACE"

      - name: Apply the ios27 metal2vulkan patch
        run: |
          set -e
          SRC="build/patches/0065-ios-read-pages-and-mapped-writable.patch"
          test -f "$SRC" || { echo "::error::missing $SRC"; exit 1; }
          DEST_DIR="UniXNU/drivers/AdrenoMetal/bridge/patches"
          test -d "$DEST_DIR" || { echo "::error::missing $DEST_DIR"; exit 1; }
          cp "$SRC" "$DEST_DIR/"
          python3 build/tools-patch-bridge.py
          echo "--- patch dir now contains ---"
          ls -1 "$DEST_DIR" | tail -5

      - name: Prepare device sources and firmware
        # 官方 device 仓的 scripts/package.sh 不准备 Ath12kWifi 的依赖：
        # prepare-supplicant.py 只做 --check（要求 deps/ 已存在），
        # 真正下载要靠 fetch-sources.py（无 --check 时才下载）。
        # freebsd 源需要 sparse-checkout + 按 commit fetch（不是 clone --branch）。
        working-directory: device
        run: |
          set -e
          python3 scripts/extract-files.py
          # 辅助脚本在 workflow 仓库的 build/ 下，device 是另一个目录
          python3 "$GITHUB_WORKSPACE/build/tools-prepare-freedsb.py" .
          python3 drivers/Ath12kWifi/tools/fetch-sources.py
          ls -la drivers/Ath12kWifi/deps/

      - name: platform seed
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          test -n "$UNIXNU_UNIQUE_CHIP_ID" || { echo "::error::set the UNIXNU_UNIQUE_CHIP_ID secret"; exit 1; }
          echo "seed length ${#UNIXNU_UNIQUE_CHIP_ID}"

      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          WATCHDOG: ${{ inputs.watchdog }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          set -e
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)

          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi

          # 非临时启动：接管固件已 arm 的 30 s Gunyah 看门狗
          if [ "$WATCHDOG" = true ]; then
            args+=(--kernel-arg uefi-watchdog=1)
          fi

          echo "package.sh ${args[*]}"
          scripts/package.sh "${args[@]}"

      - name: Verify the image is fit for persistent boot
        if: always()
        run: |
          set -e
          BOOT=$(find UniXNU/out -maxdepth 6 -type f -name boot.img | head -1)
          MAN=$(find UniXNU/out -maxdepth 6 -type f -name package.manifest.json | head -1)
          echo "boot.img : ${BOOT:-MISSING}"
          echo "manifest : ${MAN:-MISSING}"
          [ -n "$BOOT" ] || { echo "::error::no boot.img produced"; exit 1; }

          SIZE=$(stat -f %z "$BOOT")
          LIMIT=201326592            # boot_b = 192 MiB
          echo "boot.img size = $SIZE bytes"
          echo "boot_b limit  = $LIMIT bytes"
          if [ "$SIZE" -le "$LIMIT" ]; then
            echo "SIZE OK: fits boot_b with $((LIMIT - SIZE)) bytes spare"
          else
            echo "::error::boot.img is $SIZE bytes, exceeds boot_b ($LIMIT)"
            exit 1
          fi

          if [ -n "$MAN" ]; then
            python3 - "$MAN" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          cmd = m.get("kernel_command_line", "")
          print(f"cmdline bytes = {m.get('kernel_command_line_bytes', len(cmd))}")
          print(f"has uefi-watchdog=1 : {'uefi-watchdog=1' in cmd}")
          print(f"has autoreset=      : {'autoreset=' in cmd}")
          ok = True
          if "uefi-watchdog=1" not in cmd:
              print("::error::missing uefi-watchdog=1 - the 30 s firmware watchdog is not taken over, "
                    "the image cannot stay up off the PC")
              ok = False
          if "autoreset=" in cmd:
              print("::error::autoreset present - the image would reboot to fastboot on a timer")
              ok = False
          sys.exit(0 if ok else 1)
          PY
          fi

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out-artifacts
          for n in boot.img payload.img kernel.macho package.manifest.json \
                   userdata-root.img userdata-root.json data.dbr; do
            find UniXNU/out -maxdepth 6 -type f -name "$n" -exec cp -v {} out-artifacts/ \; || true
          done
          ls -lh out-artifacts/ || true
          ( cd out-artifacts && shasum -a 256 * > SHA256SUMS.txt 2>/dev/null && cat SHA256SUMS.txt ) || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-ipados${{ inputs.os }}-persistent
          path: out-artifacts/
          compression-level: 0
          retention-days: 7

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: UniXNU/out/sheng/*/*/logs/*.log
          retention-days: 7

      - name: Publish Release
        if: inputs.publish_release && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd out-artifacts
          ls -1
          TAG="sheng-ipados${{ inputs.os }}.0.1-persistent-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" * \
            --repo "${{ github.repository }}" \
            --title "sheng iPadOS ${{ inputs.os }} persistent-boot images ($TAG)" \
            --notes "device UniXNU-sheng@$(git -C ../device rev-parse --short HEAD), core UniXNU@$(git -C ../UniXNU rev-parse --short HEAD).
          Contains uefi-watchdog=1 for persistent boot; boot.img fits a 192 MiB boot_b.
          Flash: fastboot flash userdata userdata-root.img; fastboot flash boot_b boot.img; fastboot set_active b"
          echo "released $TAG"

      - name: Remove proprietary inputs
        if: always()
        run: |
          rm -rf UniXNU/out/ipsw UniXNU/out/feeds device/.cache/firmware 2>/dev/null || true
